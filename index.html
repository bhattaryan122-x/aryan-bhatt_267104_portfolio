<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryan Bhatt — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Site Header with Brand and Navigation -->
  <header id="main-header" class="site-header">
    <div class="header-container">
      <!-- Personal Brand / Monogram Link -->
      <a href="#about" class="site-brand">Aryan Bhatt</a>

      <!-- Primary Navigation Links -->
      <nav id="main-nav" class="site-nav" aria-label="Main Navigation">
        <ul id="nav-links" class="nav-links">
          <li><a href="#about" class="nav-link">01 &mdash; About</a></li>
          <li><a href="#skills" class="nav-link">02 &mdash; Skills</a></li>
          <li><a href="#projects" class="nav-link">03 &mdash; Projects</a></li>
          <li><a href="#contact" class="nav-link">04 &mdash; Contact</a></li>
        </ul>
      </nav>

      <!-- Header Action Controls -->
      <div class="header-actions">
        <!-- Dark mode toggle button -->
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle dark mode">
          <span id="theme-label" class="theme-label">Dark</span>
        </button>

        <!-- Mobile hamburger toggle button -->
        <button id="menu-toggle" class="menu-toggle-btn" type="button" aria-label="Toggle mobile menu" aria-expanded="false">
          <span class="menu-bar"></span>
          <span class="menu-bar"></span>
          <span class="menu-bar"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main content will be added here -->

  <!-- JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
